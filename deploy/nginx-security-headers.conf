# Include inside the HTTPS `server { }` block of the Agency portal (frontend host):
#   include /etc/nginx/snippets/agency-security-headers.conf;
# Then upgrade nginx to a supported release and set `server_tokens off;` in http { }.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

# Start in report-only mode, review the browser console, then rename to Content-Security-Policy.
# If the reCAPTCHA is enabled, www.google.com and www.gstatic.com are already allowed below.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; frame-src https://www.google.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

